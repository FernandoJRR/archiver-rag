<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" width="120" height="120">
  <title>Archiver RAG — stacked archive records with knowledge graph</title>
  <!-- Back record -->
  <rect x="50" y="30" width="42" height="58" fill="#ebe1cc" stroke="#221a12" stroke-opacity="0.32" stroke-width="1.6"/>
  <!-- Middle record -->
  <rect x="41" y="37" width="42" height="58" fill="#f3ecdc" stroke="#221a12" stroke-opacity="0.45" stroke-width="1.8"/>
  <!-- Front record (pulled forward) -->
  <rect x="31" y="44" width="44" height="58" fill="#f7f1e4" stroke="#221a12" stroke-width="2.4"/>
  <!-- Oxblood tab -->
  <rect x="31" y="44" width="15" height="6" fill="#8d3322"/>
  <!-- Graph edges (brass) -->
  <g stroke="#9a7a36" stroke-width="1.5" fill="none">
    <line x1="45" y1="67" x2="63" y2="60"/>
    <line x1="45" y1="67" x2="66" y2="83"/>
    <line x1="45" y1="67" x2="44" y2="90"/>
  </g>
  <!-- Satellite nodes (ink) -->
  <circle cx="63" cy="60" r="2.4" fill="#221a12"/>
  <circle cx="66" cy="83" r="2.4" fill="#221a12"/>
  <circle cx="44" cy="90" r="2.4" fill="#221a12"/>
  <!-- Hub node (oxblood) -->
  <circle cx="45" cy="67" r="3.6" fill="#8d3322"/>
</svg>
