[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "archiver-rag"
version = "0.1.0"
description = "Semantic RAG for Obsidian vaults via MCP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "chromadb",
    "sentence-transformers",
    "watchdog",
    "mcp",
    "typer",
    "rich",
]

[project.scripts]
archiver-rag = "archiver_rag.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["archiver_rag"]
