[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "archiver-rag"
version = "0.1.0"
description = "Semantic RAG for Obsidian vaults via MCP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "chromadb",
    "sentence-transformers",
    "watchdog",
    # Arrives transitively via chromadb/sentence-transformers but is imported directly
    # in graph/centroids.py, graph/terms.py, and graph/inbox.py — declared for the same
    # reason starlette/uvicorn are below (relying on an undeclared transitive dep is
    # how installs break silently).
    "numpy",
    # Floor set by StreamableHTTPSessionManager (archiver_rag/mcp/http.py). starlette
    # and uvicorn arrive transitively via mcp, but the HTTP transport depends on them
    # directly, so they are declared rather than assumed.
    "mcp>=1.9",
    "starlette",
    "uvicorn",
    "typer",
    "rich",
    "pyyaml",
    "platformdirs",
]

[dependency-groups]
dev = [
    "ruff>=0.16.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
archiver-rag = "archiver_rag.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["archiver_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "vault: requires real vault (opt-in, set ARCHIVER_RAG_VAULT)",
    "slow: loads the sentence-transformers model (embed() calls)",
]
