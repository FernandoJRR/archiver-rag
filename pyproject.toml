[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "archiver-rag"
version = "0.1.0"
description = "Agent-agnostic semantic memory for your vault. Turns notes into a queryable knowledge graph any MCP agent can search, log to, and reorganize."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "FernandoJRR", email = "fercitotron@gmail.com"},
]
keywords = [
    "obsidian",
    "mcp",
    "rag",
    "semantic-search",
    "knowledge-graph",
    "embeddings",
    "chromadb",
    "ai-agents",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Tested versions in parentheses; pinned to the tested major so PyPI installs
    # don't silently drift to an untested release.
    "chromadb>=1.5,<2",              # 1.5.9
    "sentence-transformers>=5,<6",   # 5.5.1
    "watchdog>=6,<7",                # 6.0.0
    # Arrives transitively via chromadb/sentence-transformers but is imported directly
    # in graph/centroids.py, graph/terms.py, and graph/inbox.py — declared for the same
    # reason starlette/uvicorn are below (relying on an undeclared transitive dep is
    # how installs break silently).
    "numpy",
    # Floor set by StreamableHTTPSessionManager (archiver_rag/mcp/http.py). starlette
    # and uvicorn arrive transitively via mcp, but the HTTP transport depends on them
    # directly, so they are declared rather than assumed.
    "mcp>=1.9,<2",                   # 1.27.2
    "starlette>=1.2",                # 1.2.1
    "uvicorn>=0.49",                 # 0.49.0
    "typer>=0.25,<0.26",             # 0.25.1
    "click>=8,<9",                   # typer 0.25 uses APIs removed in click 9
    "rich",
    "pyyaml",
    "platformdirs",
]

[project.urls]
Homepage = "https://fernandojrr.github.io/archiver-rag"
Repository = "https://github.com/FernandoJRR/archiver-rag"
Issues = "https://github.com/FernandoJRR/archiver-rag/issues"
Changelog = "https://github.com/FernandoJRR/archiver-rag/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.16,<0.17",
]

[project.scripts]
archiver-rag = "archiver_rag.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["archiver_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "vault: requires real vault (opt-in, set ARCHIVER_RAG_VAULT)",
    "slow: loads the sentence-transformers model (embed() calls)",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Explicit rule set so CI results don't drift with ruff's defaults.
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "PIE", "ASYNC", "PLE", "RUF100"]
# B008: typer declares options as call defaults. B905: zip() lengths are known equal.
ignore = ["B008", "B905"]
